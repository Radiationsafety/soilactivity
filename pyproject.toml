[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soilactivity"
version = "0.4.0"
description = "3D reconstruction of radionuclide volumetric activity in soil from MAED measurements."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "plotly>=7.0.0",
    "matplotlib>=3.9.4",
    "stack-data>=0.6.3",
    "pygments>=2.21.0",
    "ipywidgets>=8.1.9",
    "nbformat>=5.10.4",
    "bssunfold[all]==0.19.1",
]

[project.optional-dependencies]
accel = ["numba>=0.56.0"]
physics = ["xraylib>=4.0.0"]
dev = ["pytest>=7.0.0", "sphinx>=4.0.0", "matplotlib>=3.5.0", "xraylib>=4.0.0"]

[project.urls]
"Homepage" = "https://github.com/Radiationsafety/soilactivity"
"Bug Tracker" = "https://github.com/Radiationsafety/soilactivity/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"soilactivity.data" = ["*.json"]
